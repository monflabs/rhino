<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rhino Playground</title>
    <!-- CheerpJ runs the playground's Java (Swing) application in the browser, on its Java 21
         runtime. Keep the loader in step with the version of cheerpjInit below. -->
    <script src="https://cjrtnc.leaningtech.com/20260907_3546/loader.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #ffffff;
        color: #555555;
      }
      #bar {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 10;
        padding: 4px 10px;
        font-size: 12px;
        background: rgba(255, 255, 255, 0.85);
        border-bottom-left-radius: 6px;
      }
      #loading {
        position: absolute;
        top: 40%;
        width: 100%;
        text-align: center;
      }
      #cheerpj {
        width: 100vw;
        height: 100vh;
      }
      /* The mode of the documentation site (see the script below) */
      body.dark {
        background: #1e1e1e;
        color: #aaaaaa;
      }
      body.dark #bar {
        background: rgba(40, 40, 40, 0.85);
      }
      body.dark #bar a {
        color: #8ab4f8;
      }
    </style>
  </head>
  <body>
    <div id="bar"><a href="../">Monflabs Rhino documentation</a></div>
    <div id="loading">Loading the Rhino playground (a Java application running in your browser)...</div>
    <div id="cheerpj"></div>
    <script>
      // The mode the documentation site shows: the reader's choice (stored by the
      // docsify-darklight-theme plugin), else the system preference
      function siteTheme() {
        let theme = null;
        try {
          theme = localStorage.getItem("DARK_LIGHT_THEME");
        } catch (e) {
          // Storage not available: the system preference
        }
        if (theme !== "dark" && theme !== "light") {
          theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        return theme;
      }
      const theme = siteTheme();
      document.body.classList.toggle("dark", theme === "dark");

      (async function () {
        // CheerpJ maps "/app/" to the ROOT of the web server, not to the folder of this page,
        // so the jar URL is built from this page's own path: the site works under any base path
        const dir = location.pathname.replace(/[^/]*$/, "");
        const jar = "/app" + dir + "rhino-playground.jar";
        try {
          await cheerpjInit({ version: 21 });
          cheerpjCreateDisplay(-1, -1, document.getElementById("cheerpj"));
          document.getElementById("loading").remove();
          // The playground starts in the same mode
          await cheerpjRunMain("org.monflabs.mozilla.playground.cheerpj.PlaygroundCheerpJ", jar, "--" + theme);
        } catch (e) {
          document.getElementById("loading").textContent = "The playground could not be started: " + e;
        }
      })();
    </script>
  </body>
</html>
